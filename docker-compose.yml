services:

  db:
    image: postgres:17
    container_name: cofinga-db

    environment:
      POSTGRES_DB: cofinga
      POSTGRES_USER: cofinga
      POSTGRES_PASSWORD: cofinga123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: cofinga-api

    ports:
      - "8000:8000"

    depends_on:
      - db

    environment:
      DATABASE_URL: postgresql://cofinga:cofinga123@db:5432/cofinga

volumes:
  postgres_data:
